services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      app:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  auth:
    build: ./services/auth
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DEMO_USER: ${AUTH_DEMO_USER}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth:8000
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    # Plus de "ports:" : l'API n'est joignable que via le WAF.
    networks:
      app:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://api:8000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      MODSEC_AUDIT_LOG_FORMAT: JSON
    depends_on:
      - api
    # Seule porte d'entree de la plateforme. Ouverte sur ce PC uniquement
    # pour l'instant (127.0.0.1) ; on l'ouvrira au Wi-Fi du groupe plus tard.
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      app:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

  detector:
    build: ./services/detector
    environment:
      ORCH_TOKEN: ${ORCH_TOKEN}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - prometheus
      - orchestrator
    # Pas de "ports:" : il ne recoit rien, il appelle seulement Prometheus, Loki et l'orchestrateur.
    # Sur les deux reseaux : Loki est cote "monitoring", l'orchestrateur cote "app".
    networks:
      - app
      - monitoring
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    depends_on:
      - waf
    # Page de paiement (simulation), visible depuis ce PC uniquement.
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - app
    restart: unless-stopped

  orchestrator:
    build: ./services/orchestrator
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORCH_TOKEN: ${ORCH_TOKEN}
      AUTH_DEMO_USER: ${AUTH_DEMO_USER}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD}
      WAF_URL: http://waf:8080
    depends_on:
      db:
        condition: service_healthy
      waf:
        condition: service_started
    # Ouvert sur ce PC uniquement, pour envoyer des alertes de test.
    ports:
      - "127.0.0.1:8090:8000"
    networks:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    # Ouvert sur ce PC uniquement, pour verifier les cibles.
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    # Pas de "ports:" : seuls Alloy (ecriture) et Grafana (lecture) lui parlent.
    networks:
      - monitoring
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./services/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Lecture des logs de tous les conteneurs. Attention : un acces au socket Docker
      # est un acces tres puissant meme en lecture seule -> a documenter dans le dossier.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    restart: unless-stopped

# Adresses IP fixes : nginx (le WAF) ne traduit le nom "api" qu'au demarrage.
# Si l'API est recreee par la remediation, elle doit garder la meme adresse.
networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25   # adresses automatiques ; .10 a .13 restent reservees
  monitoring:

volumes:
  pgdata:
  promdata:
  grafanadata:
