global:
  scrape_interval: 5s      # une mesure toutes les 5 s : assez fin pour voir un flood
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  - job_name: auth
    static_configs:
      - targets: ["auth:9100"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:9100"]

  - job_name: detector
    static_configs:
      - targets: ["detector:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
