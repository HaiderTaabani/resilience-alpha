server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:" always;

    # /api/xxx  ->  WAF  /xxx   (le WAF reste la seule porte vers l'API)
    location /api/ {
        # Re-resolution du nom "waf" toutes les 5 s (evite le piege de l'IP en cache)
        resolver 127.0.0.11 valid=5s;
        set $upstream http://waf:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host resilience.local;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri /index.html;
    }
}
